<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WDK Wallet</title>
    <style>
      /* Popup baseline - extension popups need explicit min dimensions or
         Chrome renders them 0x0 until content forces growth. wdk-ui's
         WdkThemeProvider injects CSS vars on its mount element; we set
         a sensible neutral fallback here for the brief pre-mount window. */
      html, body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        min-width: 360px;
        max-width: 360px;
        min-height: 540px;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
